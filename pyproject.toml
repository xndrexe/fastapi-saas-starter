[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-saas-starter"
version = "0.1.0"
description = "Готовый шаблон FastAPI с JWT, RBAC, асинхронной SQLAlchemy 2.x, alembic-миграциями и ограничением частоты на auth-эндпоинтах."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Kostiukhov", email = "skostuhov@gmail.com" }]
keywords = ["fastapi", "jwt", "rbac", "sqlalchemy", "saas", "starter", "alembic"]

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
saas-starter = "saas_starter.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_starter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

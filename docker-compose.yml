services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    container_name: saas-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SAAS_DATABASE_URL: postgresql+asyncpg://saas:saas@postgres:5432/saas
      SAAS_HOST: 0.0.0.0
      SAAS_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
